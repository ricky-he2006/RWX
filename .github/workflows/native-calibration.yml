name: Native AMD64 calibration
on:
  push:
    branches: [benchmark/native-calibration]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -eu
          uname -m
          lscpu | head -30
          for ref in 60d182878a4f 6e677c713810; do
            git worktree add --detach "/tmp/$ref" "$ref"
            timeout 600 docker build --platform linux/amd64 "/tmp/$ref" -t "br-$ref"
          done
          mkdir -p /tmp/base
          cid=$(docker create br-6e677c713810)
          docker cp "$cid:/opt/sqlglot/." /tmp/base
          docker rm "$cid"
          mkdir results
          python3 tools/calibration_stress.py /tmp/base /tmp/stress
          python3 tools/calibration_measure.py results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measurements
          path: results
